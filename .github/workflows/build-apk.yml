name: Crear APK Gamer Cloud PC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descargar Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip gradle-8.9-bin.zip

      - name: Extraer proyecto Gamer Cloud PC
        run: |
          mkdir -p extraido
          unzip -o GamerCloudPC.zip -d extraido
          cp -r extraido/GamerCloudPC/. .

      - name: Compilar APK
        run: |
          ./gradle-8.9/bin/gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GamerCloudPC-APK
          path: app/build/outputs/apk/debug/app-debug.apk

