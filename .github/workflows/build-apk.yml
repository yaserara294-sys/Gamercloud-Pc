
name: Crear APK Gamer Cloud PC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto Gamer Cloud PC
        run: |
          mkdir -p extraido
          unzip -o GamerCloudPC.zip -d extraido
          echo "Contenido del ZIP:"
          ls -la extraido
          if [ -d "extraido/GamerCloudPC" ]; then
            cp -r extraido/GamerCloudPC/. .
          else
            cp -r extraido/. .
          fi

      - name: Comprobar Gradle
        run: |
          if [ ! -f gradlew ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GamerCloudPC-APK
          path: app/build/outputs/apk/debug/app-debug.apk
